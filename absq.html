<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>إشعارات غياب اليوم</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a2e;--mut:#5d6b70;--line:#d9d4ca;--pri:#1f6f5c;--wa:#1fa855;--ok:#2e7d32;--warn:#a5521b}
@media (prefers-color-scheme:dark){:root{--bg:#141a1c;--card:#1d2528;--ink:#eef2f1;--mut:#a6b3b6;--line:#33403f;--pri:#4fb39a;--wa:#25c264;--ok:#66bb6a;--warn:#e39a5f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0}.hint{color:var(--mut);font-size:14px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec{font-weight:700;margin:16px 0 6px;color:var(--pri)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px}
.row.sent{opacity:.65}.row .n{flex:1;min-width:0}.row .n b{display:block}.row .s{font-size:13px;color:var(--mut)}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.wa{background:var(--wa);color:#fff}.gh{background:transparent;border:1px solid var(--line);color:var(--ink)}
.ok{color:var(--ok);font-weight:700;font-size:13px}.err{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:14px;margin-top:20px}
</style></head><body><main id="app"><p class="hint">جارٍ الفتح…</p></main>
<script>
(async function(){
const app=document.getElementById('app');const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fail=m=>{app.innerHTML='<h1>إشعارات غياب اليوم</h1><div class="err">'+m+'</div>';};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let h=location.hash.slice(1);try{history.replaceState(null,'',location.pathname);}catch(e){}
if(!h){try{h=sessionStorage.getItem('absq')||'';}catch(e){}}else{try{sessionStorage.setItem('absq',h);}catch(e){}}
if(!h)return fail('الرابط غير مكتمل. اطلبي من الوكيلة إرساله من جديد.');
let D;try{const b64=h.slice(1).replace(/-/g,'+').replace(/_/g,'/');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  let txt;if(h[0]==='z'){const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'));txt=await new Response(st).text();}else txt=new TextDecoder().decode(bin);
  D=JSON.parse(txt);}catch(e){return fail('تعذّر فتح الرابط. حدّثي المتصفح، أو اطلبي من الوكيلة إرساله من جديد.');}
if(D.d!==today()||(D.ts&&Date.now()-D.ts>9*3600e3)){try{sessionStorage.removeItem('absq');}catch(e){}return fail('انتهت صلاحية هذا الرابط. روابط الإشعارات تعمل 9 ساعات فقط من إنشائها، حفاظًا على خصوصية الطالبات.');}
const KEY='absq_sent_'+D.d;let sent={};try{sent=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(sent));for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.indexOf('absq_sent_')===0&&k!==KEY)localStorage.removeItem(k);}}catch(e){}};
function draw(){const X=D.x;const n=X.length,m=X.filter(x=>sent[x.n]).length;const secs=[...new Set(X.map(x=>x.c))];
  app.innerHTML=`<h1>إشعارات غياب اليوم — ${esc(D.g)}</h1><div class="hint">${esc(D.h)} · ${esc(D.sc||'')}</div>
  <div class="bar"><div><b>أُرسل ${m} من ${n}</b><div class="hint">اضغطي «واتساب» ثم اختاري محادثة ولي الأمر، وبعد الإرسال ارجعي هنا.</div></div></div>
  ${n?secs.map(c=>`<div class="sec">${esc(D.g)}${c?' / '+esc(c):''}</div>`+X.filter(x=>x.c===c).map(x=>{const i=X.indexOf(x);return `<div class="row${sent[x.n]?' sent':''}"><div class="n"><b>${esc(x.n)}</b>${sent[x.n]?`<span class="ok">✓ أُرسل الساعة ${esc(sent[x.n])}</span>`:'<span class="s">لم يُرسل بعد</span>'}</div>
    <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(x.t)}" target="_blank" rel="noopener" data-i="${i}">واتساب</a>${sent[x.n]?`<button class="btn gh" data-u="${i}">تراجع</button>`:''}</div>`;}).join('')).join(''):'<div class="bar">لا توجد غائبات في هذا الصف اليوم.</div>'}
  <p class="hint" style="margin-top:20px">لا تعيدي إرسال هذا الرابط لأحد. فيه أسماء طالبات، وينتهي بعد 9 ساعات من إنشائه.</p>`;}
app.addEventListener('click',e=>{const a=e.target.closest('[data-i]');if(a){const x=D.x[+a.dataset.i];sent[x.n]=new Date().toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'});save();setTimeout(draw,300);return;}
  const u=e.target.closest('[data-u]');if(u){delete sent[D.x[+u.dataset.u].n];save();draw();}});
draw();})();
</script></body></html>

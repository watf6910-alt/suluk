<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b60">
<meta name="robots" content="noindex">
<title>تقديم عذر غياب</title>
<style>
:root{--bg:#f3f6f5;--surface:#fff;--line:#d5dfdc;--fg:#17201e;--muted:#5b6a66;--accent:#0d6b60;--accent-ink:#fff;--danger:#b3261e;--ok:#1f7a4d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1716;--surface:#16211f;--line:#2a3b38;--fg:#e8efed;--muted:#9fb1ac;--accent:#3fb8a6;--accent-ink:#06201c;--danger:#ff8a80;--ok:#5fcf93;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-size:22px;margin:0 0 4px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:80px}
.day{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:500}
.day input{width:22px;height:22px;min-height:0}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;min-height:48px;width:100%;margin-top:18px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--danger);font-weight:600;margin-top:12px}
.ok{color:var(--ok);font-weight:700;font-size:20px}
.info{display:grid;gap:2px;margin-top:10px;padding:12px;border-radius:12px;background:var(--bg)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="card" id="box">
  <h1>تقديم عذر غياب</h1>
  <div class="muted" id="school"></div>
  <div class="info" id="info"></div>
  <form id="f" novalidate>
    <label>أيام الغياب</label>
    <div id="days"></div>
    <label for="type">نوع العذر</label>
    <select id="type" required>
      <option value="">اختاري / اختر نوع العذر</option>
      <option>إجازة مرضية (صحتي)</option>
      <option>مراجعة مستشفى أو مركز صحي</option>
      <option>كارثة كحريق ونحوه</option>
      <option>وفاة قريب حتى الدرجة الثالثة</option>
      <option>مرافقة صحية لقريب</option>
      <option>مراجعة جهة رسمية</option>
      <option>مرافقة قريب لجهة رسمية</option>
      <option>ظرف طارئ آخر</option>
    </select>
    <label for="note">توضيح (اختياري)</label>
    <textarea id="note" maxlength="280" placeholder="مثال: مراجعة عيادة الأسنان صباحًا"></textarea>
    <label for="photo">صورة التقرير أو المستند (اختياري)</label>
    <input id="photo" type="file" accept="image/*">
    <label for="parent">اسم ولي الأمر</label>
    <input id="parent" required maxlength="80" autocomplete="name">
    <label for="phone">رقم الجوال</label>
    <input id="phone" required inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" maxlength="15" autocomplete="tel">
    <button type="submit" id="send">إرسال العذر</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<footer>منصة رصد السلوك — إعداد الموجّهة الطلابية عواطف الحربي</footer>
</main>
<script>
(function(){
  const q=new URLSearchParams(location.hash.slice(1));
  const P={u:q.get('u')||'',n:q.get('n')||'',g:q.get('g')||'',s:q.get('s')||'',sc:q.get('sc')||'',d:(q.get('d')||'').split(',').filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x))};
  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hijri=iso=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(iso+'T12:00:00'));}catch(e){return iso;}};
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(P.u)||!P.n||!P.d.length){
    $('#box').innerHTML='<h1>الرابط غير صالح</h1><p class="muted">استخدم الرابط الذي وصلك في رسالة إشعار الغياب من المدرسة.</p>';return;
  }
  $('#school').textContent=P.sc;
  $('#info').innerHTML='<div><b>الطالبة:</b> '+esc(P.n)+'</div><div><b>الصف:</b> '+esc(P.g)+(P.s?' / '+esc(P.s):'')+'</div>';
  $('#days').innerHTML=P.d.map((d,i)=>'<label class="day"><input type="checkbox" value="'+d+'" checked> '+esc(hijri(d))+'</label>').join('');
  function shrink(file){
    return new Promise((res,rej)=>{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.75));};
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;
    });
  }
  $('#f').addEventListener('submit',async e=>{
    e.preventDefault();$('#err').textContent='';
    const dates=[...document.querySelectorAll('#days input:checked')].map(x=>x.value);
    const type=$('#type').value,parent=$('#parent').value.trim(),phone=$('#phone').value.replace(/[^0-9+]/g,'');
    if(!dates.length){$('#err').textContent='اختر يومًا واحدًا على الأقل.';return;}
    if(!type){$('#err').textContent='اختر نوع العذر.';return;}
    if(!parent){$('#err').textContent='اكتب اسم ولي الأمر.';return;}
    if(phone.replace(/\D/g,'').length<9){$('#err').textContent='اكتب رقم جوال صحيح.';return;}
    const b=$('#send');b.disabled=true;b.textContent='جارٍ الإرسال…';
    try{
      let photo='';const f=$('#photo').files[0];
      if(f){try{photo=await shrink(f);}catch(x){$('#err').textContent='تعذّرت قراءة الصورة، جرّب صورة أخرى أو أرسل بدونها.';b.disabled=false;b.textContent='إرسال العذر';return;}}
      const r=await fetch(P.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'excuse',name:P.n,grade:P.g,section:P.s,dates,type,note:$('#note').value.trim(),parent,phone,photo})});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error||'x');
      $('#box').innerHTML='<p class="ok">✓ تم إرسال العذر</p><p>وصل عذر الطالبة <b>'+esc(P.n)+'</b> إلى المدرسة، وسيُراجع ويُبلَّغ ولي الأمر بالنتيجة.</p><p class="muted">شكرًا لتعاونكم.</p>';
    }catch(x){
      $('#err').textContent=x.message==='limit'?'تم إرسال عدة أعذار اليوم لهذه الطالبة، تواصل مع المدرسة.':'تعذّر الإرسال، تأكد من الاتصال بالإنترنت وحاول مرة أخرى.';
      b.disabled=false;b.textContent='إرسال العذر';
    }
  });
})();
</script>
</body>
</html>
